quarkus.swagger-ui.always-include = true

quarkus.container-image.group = quarkus

# REST client URLs for referential integrity validation
quarkus.rest-client.department.url = http://department:8090
quarkus.rest-client.organization.url = http://organization:8100
%dev.quarkus.rest-client.department.url = http://localhost:8090
%dev.quarkus.rest-client.organization.url = http://localhost:8100
%openshift.quarkus.rest-client.department.url = http://department:8090
%openshift.quarkus.rest-client.organization.url = http://organization:8100

%openshift.quarkus.container-image.group = demo-microcks
%openshift.quarkus.container-image.registry = image-registry.openshift-image-registry.svc:5000
%openshift.quarkus.kubernetes-client.trust-certs = true
%openshift.quarkus.openshift.route.expose = true

quarkus.otel.metrics.enabled = true
quarkus.otel.logs.enabled = true
quarkus.log.console.format = %d{HH:mm:ss} %-5p traceId=%X{traceId}, parentId=%X{parentId}, spanId=%X{spanId}  [%c{2.}] (%t) %s%e%n