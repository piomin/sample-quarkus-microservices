version: 2.1

jobs:
  analyze:
    docker:
      - image: 'cimg/openjdk:25.0.5'
    steps:
      - checkout
      - git-shallow-clone/checkout_advanced:
          clone_options: '--filter=blob:none'
      - run:
          name: "Git fetch"
          command: git fetch --no-filter --refetch
      - run:
          name: Analyze on SonarCloud
          command: mvn verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -DskipTests -Dquarkus.container-image.build=false
  build:
    executor:
      name: docker/machine
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Install OpenJDK 25
          command: |
            wget -q https://download.java.net/java/GA/jdk25/472eaa50255a/9/GPL/openjdk-25_linux-x64_bin.tar.gz -O /tmp/openjdk25.tar.gz
            sudo mkdir -p /opt/java/openjdk25
            sudo tar -xzf /tmp/openjdk25.tar.gz -C /opt/java/openjdk25 --strip-components=1
            echo 'export JAVA_HOME=/opt/java/openjdk25' >> $BASH_ENV
            echo 'export PATH=$JAVA_HOME/bin:$PATH' >> $BASH_ENV
      - docker/install_docker_compose
      - maven/with_cache:
          steps:
            - run:
                name: Build Images
                command: mvn package -DskipTests -Dquarkus.container-image.build=true
      - run:
          name: Run Pact Broker
          command: docker-compose up -d
      - maven/with_cache:
          steps:
            - run:
                name: Run Tests
                command: mvn package pact:publish -Dquarkus.container-image.build=false

executors:
  machine:
    machine:
      image: ubuntu-2204:current
    environment:
      architecture: "amd64"
      platform: "linux/amd64"

orbs:
  maven: circleci/maven@2.4.0
  docker: circleci/docker@4.0.1
  git-shallow-clone: guitarrapc/git-shallow-clone@2.8.0

workflows:
  maven_test:
    jobs:
      - build
      - analyze:
          context: SonarCloud
